<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thông tin tài khoản - Quán Mì Cay</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/dashboard.css" />
  <link rel="stylesheet" href="../assets/css/login_register.css">
  <link rel="stylesheet" href="../assets/css/customers.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/infaccount.css" />
  <style>
    .account-container {
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      background: #f8f9fa;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .input-group .btn {
      border-left: none;
    }
    .password-new-group {
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="dashboard-wrapper">
    <aside class="sidebar">
      <div class="sidebar-header">
        <img src="../assets/images/logo.png" alt="Logo Quán Mì Cay" class="sidebar-logo">
        <h3>Mỳ cay UTT</h3>
      </div>
      <nav class="sidebar-menu">
        <ul>
          <li><a href="dashboard.html"><i class="fas fa-home"></i> Tổng quan</a></li>
          <li><a href="menu.html"><i class="fas fa-utensils"></i> Quản lý món</a></li>
          <li><a href="category.html"><i class="fas fa-tags"></i> Quản lý danh mục</a></li>
          <li><a href="account.html"><i class="fas fa-users-cog"></i> Quản lý tài khoản</a></li>
          <li><a href="orders.html"><i class="fas fa-shopping-cart"></i> Quản lý đơn hàng</a></li>
          <li><a href="tables.html" ><i class="fas fa-table"></i> Quản lý bàn</a></li>
          <li><a href="customers.html"><i class="fas fa-user-friends"></i> Quản lý khách hàng</a></li>
          <li><a href="points.html"><i class="fas fa-gift"></i> Quản lý tích điểm</a></li>
          <li><a href="invoice.html"><i class="fas fa-file-invoice"></i>Quản lý hoá đơn</a></li>
        </ul>
      </nav>
    </aside>

    <main class="main-content">
      <header class="dashboard-header d-flex justify-content-between align-items-center">
        <h2>Thông tin tài khoản</h2>
        <div class="user-account">
          <span class="user-name" id="userName">Xin chào, ...</span>
          <div class="dropdown">
            <button class="btn btn-secondary dropdown-toggle" type="button" id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false">
              Tài khoản
            </button>
            <ul class="dropdown-menu" aria-labelledby="userDropdown">
              <li><a class="dropdown-item" href="infaccount.html">Thông tin tài khoản</a></li>
              <li><a class="dropdown-item" href="#" onclick="logout()">Đăng xuất</a></li>
            </ul>
          </div>
        </div>
      </header>

      <div class="container mt-4">
        <div class="account-container">
          <form id="infAccountForm">
            <div class="mb-3">
              <label>Họ và tên</label>
              <input type="text" id="name" class="form-control" required />
            </div>

            <div class="mb-3">
              <label>Email</label>
              <input type="email" id="email" class="form-control" readonly />
            </div>

            <div class="mb-3">
              <label>Số điện thoại</label>
              <input type="text" id="phone" class="form-control" required />
            </div>

            <div class="mb-3">
              <label>Mật khẩu</label>
              <div class="input-group">
                <input type="password" id="password" class="form-control" placeholder="********" />
                <button type="button" id="changePasswordBtn" class="btn btn-outline-secondary">Thay đổi</button>
              </div>
            </div>

            <div class="password-new-group" style="display:none;">
              <div class="mb-2">
                <label>Mật khẩu mới</label>
                <div class="input-group">
                  <input type="password" id="newPassword" class="form-control" placeholder="Nhập mật khẩu mới" />
                  <button type="button" id="toggleViewNewPassword" class="btn btn-outline-secondary">👁️</button>
                </div>
              </div>
              <div class="mb-2">
                <label>Xác nhận mật khẩu mới</label>
                <div class="input-group">
                  <input type="password" id="confirmPassword" class="form-control" placeholder="Nhập lại mật khẩu mới" />
                  <button type="button" id="toggleViewConfirmPassword" class="btn btn-outline-secondary">👁️</button>
                </div>
              </div>
            </div>

            <div class="mt-3 d-flex gap-2">
              <button type="submit" class="btn btn-success">Lưu thay đổi</button>
              <button type="button" onclick="goBack()" class="btn btn-secondary">Quay lại</button>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/infaccount.js"></script>
</body>
</html>
